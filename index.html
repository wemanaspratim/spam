<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spam</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#ffb3b3,#ffd6d6);
text-align:center;
overflow:hidden;
}

/* MAIN SCREEN */
#main{
margin-top:150px;
}

button{
padding:12px 28px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
margin:10px;
}

#yes{background:#ff4d6d;color:white;}
#no{background:#444;color:white;}

/* LOADING SCREEN */
#loadingScreen{
display:none;
margin-top:150px;
}

#bar{
width:300px;
height:25px;
border:2px solid white;
margin:auto;
}

#progress{
height:100%;
width:0%;
background:white;
}

/* FINAL MESSAGE */
#meme{
display:none;
width:230px;
margin-top:20px;
border-radius:12px;
}

/* RICK GIF */
#rick{
position:fixed;
bottom:10px;
right:10px;
width:120px;
display:none;
}

/* HEARTS */
.heart{
position:fixed;
bottom:-20px;
font-size:24px;
animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);opacity:0;}
}

/* CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear infinite;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<!-- QUESTION PAGE -->
<div id="main">
<h1>Hey Ken Doll ❤️</h1>
<h2>Will you be my Valentine?</h2>
<button id="yes">Yes</button>
<button id="no">No</button>
</div>

<!-- LOADING PAGE -->
<div id="loadingScreen">

<h2>🔍 Checking Compatibility</h2>

<div id="scanner">
<img src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif" width="80">
</div>

<br>

<div id="bar">
<div id="progress"></div>
</div>

<h3 id="percent">0%</h3>

<h2 id="result" style="display:none;">
Result: Permanently Stuck with Barbie 💘
</h2>

<div id="finalMessage" style="display:none;">
<h2>I love you ❤️<br>Happy Valentine’s Day Jaan tu!</h2>
<img id="meme" src="IMG_0456.png" alt="Success Kid">

</div>

</div>

<!-- RICK ASTLEY GIF -->
<img id="rick" src="https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif">

<audio id="song" preload="auto" playsinline>
<source src="https://www.myinstants.com/media/sounds/rickroll.mp3">
</audio>

<script>

const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");

const main=document.getElementById("main");
const loading=document.getElementById("loadingScreen");

const progress=document.getElementById("progress");
const percent=document.getElementById("percent");

const result=document.getElementById("result");
const finalMessage=document.getElementById("finalMessage");

const meme=document.getElementById("meme");
const song=document.getElementById("song");
const rick=document.getElementById("rick");

/* NO BUTTON */
noBtn.onclick=()=>{
alert("Error 404: Wrong Choice Detected 😆");
};

/* YES BUTTON */
yesBtn.onclick=startLoading;

/* LOADING FUNCTION */
function startLoading(){

main.style.display="none";
loading.style.display="block";

let count=0;

const load=setInterval(()=>{

count++;
progress.style.width=count+"%";
percent.innerText=count+"%";

if(count>=100){

clearInterval(load);

/* HIDE LOADING ELEMENTS */
document.getElementById("bar").style.display="none";
document.getElementById("scanner").style.display="none";
percent.style.display="none";

/* SHOW FINAL RESULT */
result.style.display="block";
finalMessage.style.display="block";
meme.style.display="block";

launchHearts();
launchConfetti();
fadeMusic();

rick.style.display="block";

}

},40);
}

/* MUSIC FADE IN */
function fadeMusic(){
song.volume=0;
song.play();

let vol=0;

const fade=setInterval(()=>{
if(vol<1){
vol+=0.05;
song.volume=vol;
}else{
clearInterval(fade);
}
},200);
}

/* HEARTS */
function launchHearts(){
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),7000);
},300);
}

/* CONFETTI */
function launchConfetti(){
for(let i=0;i<80;i++){
const confetti=document.createElement("div");
confetti.className="confetti";
confetti.style.left=Math.random()*100+"vw";
confetti.style.backgroundColor=`hsl(${Math.random()*360},100%,70%)`;
document.body.appendChild(confetti);

setTimeout(()=>confetti.remove(),4000);
}
}

</script>

</body>
</html>
