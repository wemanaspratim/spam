<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spam</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ffb3b3, #ffd6d6);
  overflow: hidden;
  text-align: center;
}

h1, h2 {
  color: white;
}

.buttons {
  position: relative;
  width: 300px;
  height: 150px;
}

button {
  padding: 12px 28px;
  font-size: 1.2rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
}

#yes {
  left: 40px;
  background-color: #ff4d6d;
  color: white;
}

#no {
  right: 40px;
  background-color: #444;
  color: white;
}

#message {
  margin-top: 20px;
  font-size: 1.8rem;
  color: white;
  display: none;
}

#meme {
  display: none;
  margin-top: 20px;
  width: 220px;
  border-radius: 12px;
}

/* Hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 24px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0); }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* Confetti */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall 3s linear infinite;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>

<body>

<h1 id="title">Hey Ken Doll ❤️</h1>
<h2 id="question">Will you be my Valentine?</h2>

<div class="buttons">
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<div id="message">
  I love you ❤️<br>
  Happy Valentine’s Day Jaan tu!
</div>

<img id="meme" src="https://i.imgur.com/dM7Thhn.png" alt="Success Kid">

<audio id="song" preload="auto" playsinline>
  <source src="https://www.myinstants.com/media/sounds/rickroll.mp3" type="audio/mpeg">
</audio>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const message = document.getElementById("message");
const meme = document.getElementById("meme");
const song = document.getElementById("song");
const title = document.getElementById("title");
const question = document.getElementById("question");

/* Floating NO button */
const noMove = setInterval(() => {
  const maxX = window.innerWidth - noBtn.offsetWidth;
  const maxY = window.innerHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}, 900);

/* YES CLICK */
yesBtn.addEventListener("click", () => {

  /* Remove question + buttons */
  title.style.display = "none";
  question.style.display = "none";
  yesBtn.style.display = "none";

  clearInterval(noMove);
  noBtn.style.display = "none";

  /* Show message + meme */
  message.style.display = "block";
  meme.style.display = "block";

  launchHearts();
  launchConfetti();
  fadeInSong();
});

/* Smooth Fade Music */
function fadeInSong() {
  song.volume = 0;

  song.play().then(() => {
    let volume = 0;

    const fade = setInterval(() => {
      if (volume < 1) {
        volume += 0.05;
        song.volume = volume;
      } else {
        clearInterval(fade);
      }
    }, 200);
  });
}

/* Hearts */
function launchHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }, 300);
}

/* Confetti */
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor =
      `hsl(${Math.random()*360},100%,70%)`;

    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4000);
  }
}

</script>

</body>
</html>
